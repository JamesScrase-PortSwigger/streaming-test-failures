name: Streaming failures experiment

on:
  push:
  workflow_dispatch:
    inputs:
      cases:
        description: Slow test cases (two in three fail)
        default: "18"
      delay-millis:
        description: Delay per case
        default: "10000"

permissions:
  contents: read
  checks: write
  actions: read

env:
  DEMO_ARGS: -Pdemo.cases=${{ inputs.cases || '18' }} -Pdemo.delayMillis=${{ inputs.delay-millis || '10000' }}

jobs:
  check-run-mode:
    name: Stream via check run API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run tests
        env:
          STREAMING_FAILURES_MODE: check-run
          STREAMING_FAILURES_FLUSH_SECONDS: "10"
          CHECK_RUN_ID: ${{ job.check_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --console=plain test $DEMO_ARGS

  workflow-command-mode:
    name: Stream via workflow commands
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run tests
        env:
          STREAMING_FAILURES_MODE: workflow-command
        run: ./gradlew --console=plain test $DEMO_ARGS

  observe:
    name: Observe annotations while tests run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Poll both jobs' check runs until they finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/observe.sh "Stream via check run API" "Stream via workflow commands"

  final-state:
    name: Inspect check runs after completion
    needs: [check-run-mode, workflow-command-mode]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dump each job's final check run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/final-state.sh "Stream via check run API" "Stream via workflow commands"
