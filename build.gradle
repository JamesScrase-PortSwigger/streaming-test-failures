plugins {
    id 'java'
    id 'streaming-test-failures'
}

apply plugin: 'org.gradle.test-retry'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'demo.cases', providers.gradleProperty('demo.cases').getOrElse('9')
    systemProperty 'demo.delayMillis', providers.gradleProperty('demo.delayMillis').getOrElse('6000')
    def attemptsDir = layout.buildDirectory.dir('demo-attempts').get().asFile
    systemProperty 'demo.attemptsDir', attemptsDir.absolutePath
    doFirst { attemptsDir.deleteDir() }
    outputs.upToDateWhen { false }
    retry {
        maxRetries = 2
        maxFailures = 20
    }
}
