plugins {
    id 'java-gradle-plugin'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    gradlePluginPortal()
}

dependencies {
    implementation 'org.gradle:test-retry-gradle-plugin:1.6.2'
}

gradlePlugin {
    plugins {
        streamingTestFailures {
            id = 'streaming-test-failures'
            implementationClass = 'streaming.StreamingTestFailuresPlugin'
        }
    }
}
